[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="levels/*.json, data/*.json"
exclude_filter="tools/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
/*
 * Chain Escape - Web audio unlock (iOS Safari first, all browsers).
 *
 * Injected into the exported page's <head> BEFORE the Godot engine loads
 * (export_presets.cfg -> html/head_include; regenerate it with
 * tools/sync_web_head.py after editing this file).
 *
 * Why this exists: Godot creates its AudioContext at engine start, before
 * any tap, so browsers create it \"suspended\". iOS Safari only lets a page
 * start audio from inside an activation event (touchend / click / pointerup
 * / keydown), and plays Web Audio through the ringer/silent switch unless
 * the page asks for the \"playback\" audio session. The engine does not
 * expose its context, so we capture it here and unlock it ourselves.
 *
 * On EVERY activation event until audio runs (and again if iOS later
 * interrupts it):
 *   1. navigator.audioSession.type = \"playback\"   (iOS 17+: ignore mute switch)
 *   2. iOS without audioSession: play a 50 ms silent <audio> once
 *   3. ctx.resume() on every captured AudioContext that is not \"running\"
 *   4. start a 1-frame silent buffer on it (older iOS needs a real start)
 * Godot polls window.ceAudio.state() and starts music only once it reports
 * \"running\" after a real gesture. Nothing audible is ever played here.
 * Only failures are logged (console.warn).
 *
 * v0.5.1 also provides, for saves and diagnostics (no gameplay effect):
 *   - storage(): can this page keep data? (localStorage test write; Safari
 *     /iOS WebKit makes storage in a CROSS-ORIGIN IFRAME - e.g. an itch.io
 *     embed - partitioned AND ephemeral: cleared when Safari closes)
 *   - navigator.storage.persist() request (less eviction where supported)
 *   - saveNotice(on): a small native \"open the game in its own tab\" banner,
 *     shown by the game only when saves can't survive in this context; its
 *     button is a real DOM tap, so window.open is never popup-blocked
 *   - memory(): WebAssembly heap + JS heap sizes for the [Diag] lines
 *   - page events for crash forensics, kept in localStorage so the NEXT
 *     launch can tell how this session ended: backgrounded / page hidden,
 *     JS errors, engine aborts, WebGL context loss (pageEvents())
 *   - WebGL context loss (iOS does this after backgrounding or GPU memory
 *     pressure): Godot 4.3 only shows a blocking \"please reload\" alert and
 *     never recovers. We show a short native note and reload instead; the
 *     save is already on disk, so the player lands on CONTINUE - LEVEL X.
 */
(function () {
  'use strict';
  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  // Every iOS browser is WebKit; on desktop only Safari is.
  var isWebKit = isIOS || (/Safari\\//.test(ua) && !/Chrome|Chromium|CriOS|Edg\\/|Firefox|FxiOS|OPR\\//.test(ua));
  var inIframe = false;
  var crossOrigin = false;
  try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
  if (inIframe) {
    try { void window.top.location.href; } catch (e) { crossOrigin = true; }
  }

  function warn(msg) { console.warn('[CE-Audio] ' + msg); }

  // --- page events (crash forensics) ----------------------------------------
  var EVENTS = 'chain_escape_page_events';
  var prevEvents = '';
  function pageLog(patch) {
    try {
      var d = JSON.parse(localStorage.getItem(EVENTS) || '{}');
      for (var k in patch) d[k] = patch[k];
      localStorage.setItem(EVENTS, JSON.stringify(d));
    } catch (e) { /* storage blocked: nothing to record */ }
  }
  try {
    prevEvents = localStorage.getItem(EVENTS) || '';
    localStorage.setItem(EVENTS, JSON.stringify({ started: Date.now() }));
  } catch (e) { /* ignore */ }
  document.addEventListener('visibilitychange', function () {
    pageLog(document.visibilityState === 'hidden' ? { hidden_at: Date.now() } : { hidden_at: 0, visible_at: Date.now() });
  });
  window.addEventListener('pagehide', function () { pageLog({ pagehide_at: Date.now() }); });
  window.addEventListener('error', function (e) { pageLog({ error: String(e.message || e).slice(0, 200), error_at: Date.now() }); });
  window.addEventListener('unhandledrejection', function (e) { pageLog({ error: String(e.reason || e).slice(0, 200), error_at: Date.now() }); });
  var origError = console.error;
  console.error = function () {
    var msg = Array.prototype.join.call(arguments, ' ');
    if (/Aborted\\(|RuntimeError|out of memory|memory access out of bounds/i.test(msg)) pageLog({ abort: msg.slice(0, 200), abort_at: Date.now() });
    return origError.apply(console, arguments);
  };

  // --- WebGL context loss -> recover by reloading (progress is saved) -------
  var reloading = false;
  function reloadSoon() {
    if (reloading) return;
    reloading = true;
    var note = document.createElement('div');
    note.style.cssText = 'position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(20,18,32,.85);' +
      'color:#fff;font:600 17px/1.4 -apple-system,system-ui,sans-serif;text-align:center;padding:24px';
    note.textContent = 'The browser reset the graphics. Reloading - your progress is saved.';
    document.body.appendChild(note);
    setTimeout(function () { location.reload(); }, 1200);
  }
  window.addEventListener('webglcontextlost', function (e) {
    pageLog({ context_lost_at: Date.now(), context_lost_hidden: document.hidden });
    e.preventDefault();
    e.stopImmediatePropagation(); // skip the engine's blocking alert
    if (!document.hidden) { reloadSoon(); return; }
    document.addEventListener('visibilitychange', function once() {
      if (!document.hidden) { document.removeEventListener('visibilitychange', once); reloadSoon(); }
    });
  }, true);

  // --- WebAssembly memory (diagnostics) -------------------------------------
  var wasmMemory = null;
  function grab(result) {
    try {
      var inst = result && (result.instance || result);
      var ex = inst && inst.exports;
      if (ex) for (var k in ex) if (ex[k] instanceof WebAssembly.Memory) { wasmMemory = ex[k]; break; }
    } catch (e) { /* diagnostics only */ }
    return result;
  }
  if (window.WebAssembly) {
    ['instantiate', 'instantiateStreaming'].forEach(function (name) {
      var orig = WebAssembly[name];
      if (orig) WebAssembly[name] = function () { return orig.apply(this, arguments).then(grab); };
    });
  }
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  } catch (e) { /* optional */ }

  // --- v0.5.2: where can progress live? ---------------------------------------
  // Safari / every iOS browser (WebKit) gives a CROSS-ORIGIN IFRAME - the
  // itch.io embed - storage that is partitioned (separate from the game's
  // own tab) and ephemeral (erased when Safari closes). Nothing written
  // there survives, so on WebKit-in-an-embed the game must run in its own
  // tab (first-party storage, kept on disk) BEFORE any progress is made.
  var ephemeralEmbed = isWebKit && crossOrigin;
  var context = !inIframe ? 'standalone' : (crossOrigin ? (ephemeralEmbed ? 'embed-ephemeral' : 'embed-partitioned') : 'iframe-same-origin');
  var SAVE_KEY = 'chain_escape_save';
  var gateChoice = ephemeralEmbed ? 'pending' : 'none'; // pending | tab | here | none

  // Progress transferred from an embed arrives in the URL fragment (never
  // sent to any server). Taken once, then removed from the address bar.
  var transfer = '';
  try {
    var m = /[#&]ce_transfer=([^&]*)/.exec(location.hash || '');
    if (m) {
      transfer = decodeURIComponent(escape(atob(decodeURIComponent(m[1]).replace(/-/g, '+').replace(/_/g, '/'))));
      history.replaceState(null, '', location.pathname + location.search);
    }
  } catch (e) { warn('transfer data unreadable: ' + e); transfer = ''; }

  function standaloneUrl(withProgress) {
    var url = location.href.split('#')[0];
    if (!withProgress) return url;
    var text = '';
    try { text = localStorage.getItem(SAVE_KEY) || ''; } catch (e) { text = ''; }
    if (!text) return url;
    var b64 = btoa(unescape(encodeURIComponent(text))).replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=+$/, '');
    return url + '#ce_transfer=' + b64;
  }

  var ui = 'font-family:-apple-system,system-ui,sans-serif;';
  function btnCss(bg, fg) {
    return 'display:block;width:100%;border:0;border-radius:16px;padding:15px 12px;margin-top:10px;background:' + bg + ';color:' + fg + ';' + ui + 'font-weight:800;font-size:17px';
  }

  // Opens the game in its own Safari tab from inside a real tap (never
  // popup-blocked). Falls back to navigating the whole page, then to
  // showing the address to copy.
  function openInTab(withProgress, fallbackHost) {
    var url = standaloneUrl(withProgress);
    var w = null;
    try { w = window.open(url, '_blank'); } catch (e) { w = null; }
    if (w) { gateChoice = 'tab'; return; }
    try { window.top.location.href = url; gateChoice = 'tab'; return; } catch (e) { /* sandboxed */ }
    if (fallbackHost) {
      var p = document.createElement('p');
      p.style.cssText = 'margin:12px 0 0;font-size:13px;word-break:break-all;user-select:all;-webkit-user-select:all';
      p.textContent = 'Copy this address into Safari: ' + url.split('#')[0];
      fallbackHost.appendChild(p);
    }
  }

  function showNotSavedPill() {
    if (document.getElementById('ce-unsaved')) return;
    var pill = document.createElement('button');
    pill.id = 'ce-unsaved';
    pill.textContent = 'NOT SAVED · OPEN IN SAFARI';
    // Top edge, above the HUD title: never under the home indicator or a
    // browser toolbar, and never over the game's buttons.
    pill.style.cssText = 'position:fixed;left:50%;top:max(4px,env(safe-area-inset-top));transform:translateX(-50%);z-index:9998;border:0;' +
      'border-radius:999px;padding:6px 12px;background:#D7263D;color:#fff;' + ui + 'font-weight:800;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.3)';
    pill.addEventListener('click', function () { openInTab(true, null); });
    document.body.appendChild(pill);
  }

  // The gate: shown before the game can be played in an ephemeral embed.
  function showGate() {
    if (document.getElementById('ce-gate')) return;
    var g = document.createElement('div');
    g.id = 'ce-gate';
    g.style.cssText = 'position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;background:rgba(18,16,30,.94);' +
      'color:#fff;' + ui + 'padding:20px';
    var card = document.createElement('div');
    card.style.cssText = 'max-width:420px;width:100%;text-align:center';
    card.innerHTML = '<div style=\"font-size:28px;font-weight:900;letter-spacing:.5px\">CHAIN ESCAPE</div>' +
      '<div style=\"font-size:20px;font-weight:800;margin:18px 0 8px\">Save your progress</div>' +
      '<div style=\"font-size:15px;line-height:1.45;opacity:.9\">On iPhone, iPad and in Safari, the browser <b>erases games played inside the itch.io page</b> when Safari closes.<br><br>' +
      'Open Chain Escape in its own Safari tab: your levels, stars, coins and score are kept there, even after closing Safari. ' +
      'Next time, open the game the same way - tap <b>OPEN GAME IN SAFARI</b> and your progress is waiting.</div>';
    var open = document.createElement('button');
    open.id = 'ce-gate-open';
    open.textContent = 'OPEN GAME IN SAFARI';
    open.style.cssText = btnCss('#FF5A1F', '#fff') + ';margin-top:22px';
    open.addEventListener('click', function () { openInTab(true, card); });
    var here = document.createElement('button');
    here.id = 'ce-gate-here';
    here.textContent = 'Play here without saving';
    here.style.cssText = btnCss('transparent', 'rgba(255,255,255,.8)') + ';font-weight:700;font-size:15px;text-decoration:underline';
    here.addEventListener('click', function () {
      gateChoice = 'here';
      g.style.display = 'none';
      showNotSavedPill();
    });
    card.appendChild(open);
    card.appendChild(here);
    g.appendChild(card);
    document.body.appendChild(g);
  }
  if (ephemeralEmbed) {
    if (document.body) showGate(); else document.addEventListener('DOMContentLoaded', showGate);
  }

  // Backup code dialog (native, so copy/paste and the keyboard work on
  // every phone). mode 'show': the code with COPY; mode 'restore': paste.
  var pendingImport = '';
  var dialogOpen = false;
  function backupDialog(mode, code) {
    var old = document.getElementById('ce-backup');
    if (old) old.remove();
    dialogOpen = true;
    var d = document.createElement('div');
    d.id = 'ce-backup';
    d.style.cssText = 'position:fixed;inset:0;z-index:10002;display:flex;align-items:center;justify-content:center;background:rgba(18,16,30,.9);' + ui + 'padding:18px';
    var c = document.createElement('div');
    c.style.cssText = 'background:#fff;color:#2B2440;border-radius:22px;padding:20px;max-width:440px;width:100%';
    var title = document.createElement('div');
    title.style.cssText = 'font-size:20px;font-weight:900;margin-bottom:8px';
    title.textContent = mode === 'show' ? 'BACKUP CODE' : 'RESTORE FROM BACKUP CODE';
    var help = document.createElement('div');
    help.style.cssText = 'font-size:14px;line-height:1.4;margin-bottom:10px;color:#5C5475';
    help.textContent = mode === 'show'
      ? 'Copy this code and keep it somewhere safe (Notes, a message to yourself). Paste it into RESTORE on any browser or phone to get your progress back.'
      : 'Paste your backup code. Your progress is combined with it - nothing you already have is lost.';
    var ta = document.createElement('textarea');
    ta.id = 'ce-backup-text';
    ta.style.cssText = 'width:100%;box-sizing:border-box;height:120px;border:2px solid #E4DEF2;border-radius:12px;padding:8px;font:12px/1.3 ui-monospace,monospace;word-break:break-all';
    if (mode === 'show') { ta.value = code; ta.readOnly = true; }
    var main = document.createElement('button');
    main.id = 'ce-backup-main';
    main.textContent = mode === 'show' ? 'COPY CODE' : 'RESTORE';
    main.style.cssText = btnCss('#FF5A1F', '#fff');
    main.addEventListener('click', function () {
      if (mode === 'show') {
        ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        try { if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function () {}, function () {}); ok = true; } catch (e) { /* select+copy above */ }
        main.textContent = ok ? 'COPIED' : 'SELECT THE CODE AND COPY IT';
      } else {
        pendingImport = ta.value;
        close();
      }
    });
    var cancel = document.createElement('button');
    cancel.id = 'ce-backup-close';
    cancel.textContent = mode === 'show' ? 'DONE' : 'CANCEL';
    cancel.style.cssText = btnCss('#F1EDF9', '#2B2440');
    function close() { dialogOpen = false; d.remove(); }
    cancel.addEventListener('click', close);
    c.appendChild(title); c.appendChild(help); c.appendChild(ta); c.appendChild(main); c.appendChild(cancel);
    d.appendChild(c);
    document.body.appendChild(d);
  }

  // --- capture every AudioContext the engine creates -----------------------
  var contexts = [];
  var Orig = window.AudioContext || window.webkitAudioContext;
  if (Orig) {
    var Wrapped = function (opts) {
      var c = (opts === undefined) ? new Orig() : new Orig(opts);
      contexts.push(c);
      return c;
    };
    Wrapped.prototype = Orig.prototype;
    window.AudioContext = Wrapped;
    if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
  } else {
    warn('no Web Audio support in this browser');
  }

  var SILENT_WAV = 'data:audio/wav;base64,';
  var gestures = 0;
  var unlockAttempts = 0;
  var mediaKicked = false;

  function allRunning() {
    if (!contexts.length) return false;
    for (var i = 0; i < contexts.length; i++) if (contexts[i].state !== 'running') return false;
    return true;
  }

  function unlock() {
    // 1) iOS 17+: route Web Audio as media playback (not muted by the silent switch).
    if (navigator.audioSession && navigator.audioSession.type !== 'playback') {
      try { navigator.audioSession.type = 'playback'; } catch (e) { warn('audioSession not settable: ' + e); }
    }
    // 2) Older iOS: a short silent media element switches the audio route.
    if (isIOS && !navigator.audioSession && !mediaKicked) {
      mediaKicked = true;
      try {
        var a = document.createElement('audio');
        a.setAttribute('playsinline', '');
        a.src = SILENT_WAV;
        var p = a.play();
        if (p && p.catch) p.catch(function (e) { warn('silent media kick failed: ' + e); });
      } catch (e) { warn('silent media kick error: ' + e); }
    }
    if (!contexts.length) return; // engine not started yet - the next tap retries
    unlockAttempts++;
    // 3) + 4) resume and start a silent buffer, synchronously inside the gesture.
    contexts.forEach(function (c) {
      if (c.state !== 'running') {
        try {
          c.resume().catch(function (e) { warn('resume() rejected: ' + e + ' (will retry on the next tap)'); });
        } catch (e) { warn('resume() threw: ' + e); }
      }
      try {
        var src = c.createBufferSource();
        src.buffer = c.createBuffer(1, 1, c.sampleRate);
        src.connect(c.destination);
        src.start(0);
      } catch (e) { warn('silent buffer failed: ' + e); }
    });
  }

  function onGesture() {
    gestures++;
    if (allRunning()) return; // already unlocked: nothing to do, never restarts anything
    unlock();
  }

  // Activation-triggering events only (touchstart is NOT one on iOS).
  ['touchend', 'pointerup', 'mouseup', 'click', 'keydown'].forEach(function (t) {
    window.addEventListener(t, onGesture, { capture: true, passive: true });
  });

  // --- API used by Godot (JavaScriptBridge) --------------------------------
  window.ceAudio = {
    isIOS: isIOS,
    /** \"running\" when every engine AudioContext runs; \"none\" before creation. */
    state: function () {
      if (!contexts.length) return 'none';
      return allRunning() ? 'running' : contexts[0].state;
    },
    gestures: function () { return gestures; },
    /** Can progress survive here? (see header). */
    storage: function () {
      var ls = false;
      try { localStorage.setItem('__ce_probe', '1'); ls = localStorage.getItem('__ce_probe') === '1'; localStorage.removeItem('__ce_probe'); }
      catch (e) { ls = false; }
      return { localStorage: ls, iframe: inIframe, crossOrigin: crossOrigin, webkit: isWebKit, ephemeral: ephemeralEmbed,
        context: context, gate: gateChoice, ios: isIOS };
    },
    /** Save text handed over from an embed (URL fragment), once; '' if none. */
    takeTransfer: function () { var t = transfer; transfer = ''; return t; },
    /** Backup code dialog: mode 'show' (with the code) or 'restore'. */
    backupDialog: function (mode, code) { backupDialog(mode, code || ''); },
    /** Text pasted into RESTORE, once; '' if none. */
    takeImport: function () { var t = pendingImport; pendingImport = ''; return t; },
    dialogOpen: function () { return dialogOpen; },
    /** Game -> page calls (plain function calls; the game never evals generated source). */
    publish: function (name, json) { try { window[name] = JSON.parse(json); } catch (e) { /* ignore */ } },
    lsSet: function (key, value) {
      try { localStorage.setItem(key, value); return localStorage.getItem(key) !== null; } catch (e) { return false; }
    },
    lsGet: function (key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } },
    /** JSON of an object-returning method (storage, memory, info). */
    json: function (method) { try { return JSON.stringify(window.ceAudio[method]()); } catch (e) { return '{}'; } },
    /** What the PREVIOUS page load recorded (JSON string, '' if none). */
    pageEvents: function () { return prevEvents; },
    /** Heap sizes in MB (WebAssembly linear memory; Chrome-only JS heap). */
    memory: function () {
      var js = (performance && performance.memory) ? Math.round(performance.memory.usedJSHeapSize / 1048576) : 0;
      return { wasm: wasmMemory ? Math.round(wasmMemory.buffer.byteLength / 1048576) : 0, js: js };
    },
    /** Native banner: \"open the game in its own tab so progress is kept\". */
    saveNotice: function (on, text, button) {
      var el = document.getElementById('ce-save-notice');
      if (!on) { if (el) el.style.display = 'none'; return; }
      if (!el) {
        el = document.createElement('div');
        el.id = 'ce-save-notice';
        el.style.cssText = 'position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:9999;' +
          'max-width:92vw;background:#1D1A2E;color:#fff;font:600 14px/1.35 -apple-system,system-ui,sans-serif;padding:10px 12px;' +
          'border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center';
        var msg = document.createElement('span');
        msg.id = 'ce-save-notice-text';
        var btn = document.createElement('button');
        btn.id = 'ce-save-notice-btn';
        btn.style.cssText = 'flex:none;border:0;border-radius:10px;padding:8px 10px;background:#FF5A1F;color:#fff;font:700 14px system-ui,sans-serif';
        btn.addEventListener('click', function () { window.open(location.href, '_blank'); });
        el.appendChild(msg);
        el.appendChild(btn);
        document.body.appendChild(el);
      }
      document.getElementById('ce-save-notice-text').textContent = text;
      document.getElementById('ce-save-notice-btn').textContent = button;
      el.style.display = 'flex';
    },
    /** Counters for automated tests (no logging). */
    info: function () { return { gestures: gestures, unlockAttempts: unlockAttempts, contexts: contexts.length }; }
  };
})();
</script>
<script>
/*
 * Chain Escape - Social creator page helpers (Social MVP 0.2A).
 *
 * Kept apart from web/audio_unlock.js (audio, saves, backup codes): this
 * script never touches localStorage, the save, audio or the network.
 *
 * 1. Photo picker. iPhone Safari opens a file picker only from inside a
 *    real tap (touchend / mouse up), and Godot handles taps a frame later.
 *    So Godot registers \"pick zones\" (normalized screen rectangles of its
 *    CHOOSE PHOTO buttons) and this script opens the native picker from
 *    the tap itself when a tap starts and ends inside a zone. The chosen
 *    image is decoded by the browser (so iPhone photos, EXIF rotation and
 *    HEIC-to-JPEG conversion are handled natively), scaled down to at most
 *    MAX_EDGE pixels and re-encoded as JPEG. Only that small copy goes to
 *    the game; the original file is never modified, stored or uploaded.
 * 2. Message dialog. A native textarea (the iPhone keyboard works with
 *    it), opened from the tap in the same way so the keyboard comes up at
 *    once, and pinned to the top of the visible area above the keyboard.
 *
 * 3. Share (0.2C). SHARE CHALLENGE and COPY LINK are tap zones too, so the
 *    native share sheet (navigator.share) and the clipboard - both need a
 *    real tap on iPhone - run inside the tap. Without navigator.share the
 *    link is copied instead. Only the link (challenge id) is shared: never
 *    the message or photo.
 * 4. Launch link (0.2C): the challenge id in this page's own address
 *    (?challenge=<id>, or #challenge=<id>), read once for the game, which
 *    validates it.
 *
 * Godot polls takePhoto() / takeMessage() / takeShareResult() (plain
 * function calls).
 */
(function () {
  var MAX_EDGE = 1080;          // longest edge of the working copy
  var JPEG_QUALITY = 0.85;
  var MAX_FILE_BYTES = 40 * 1024 * 1024;
  var MESSAGE_MAX = 200;

  var zones = [];               // [{id, x, y, w, h}] normalized to the canvas
  var photoResult = '';         // JSON waiting for Godot
  var photoBusy = false;
  var messageResult = '';
  var draft = '';
  var dialogOpen = false;
  var lastFire = 0;
  var start = null;             // where the current touch / press began
  var input = null;
  var share = { url: '', text: '', title: '' };
  var shareResult = '';

  // Launch address parameters, read once. Values end at &, # or a second
  // ?, so a parameter appended to a full link (\".../index.html?challenge=
  // <id>?friendbench=1\") is still read as two parameters.
  //   challenge    the shared challenge id, as given (the game validates it:
  //                a malformed one gets a friendly \"not available\" screen
  //                instead of the normal start). null = no parameter at all.
  //   friendbench  1 = the developer generation benchmark page.
  var launchRaw = null;
  var devBench = false;
  try {
    var parts = String(location.search + location.hash).split(/[?&#]/);
    for (var pi = 0; pi < parts.length; pi++) {
      var eq = parts[pi].indexOf('=');
      var key = (eq < 0 ? parts[pi] : parts[pi].slice(0, eq)).trim();
      var val = eq < 0 ? '' : parts[pi].slice(eq + 1);
      try { val = decodeURIComponent(val); } catch (e2) { /* keep as given */ }
      if (key === 'challenge' && eq >= 0 && launchRaw === null) {
        launchRaw = String(val).trim().slice(0, 64);
      } else if (key === 'friendbench' && /^(1|true)?$/i.test(String(val).trim())) {
        devBench = true;
      }
    }
  } catch (e) { launchRaw = null; devBench = false; }
  var ui = 'font-family:-apple-system,system-ui,sans-serif;';

  function canvasRect() {
    var c = document.getElementById('canvas') || document.querySelector('canvas');
    return c ? c.getBoundingClientRect() : null;
  }

  function zoneAt(x, y) {
    var r = canvasRect();
    if (!r || r.width <= 0 || r.height <= 0) return null;
    var nx = (x - r.left) / r.width, ny = (y - r.top) / r.height;
    for (var i = 0; i < zones.length; i++) {
      var z = zones[i];
      if (nx >= z.x && nx <= z.x + z.w && ny >= z.y && ny <= z.y + z.h) return z;
    }
    return null;
  }

  function point(e) {
    var t = e.changedTouches && e.changedTouches[0];
    return t ? { x: t.clientX, y: t.clientY } : { x: e.clientX, y: e.clientY };
  }

  function otherDialogOpen() {
    return dialogOpen || !!document.getElementById('ce-backup') || !!document.getElementById('ce-gate') &&
      document.getElementById('ce-gate').style.display !== 'none';
  }

  function onStart(e) {
    if (!zones.length || otherDialogOpen()) { start = null; return; }
    var p = point(e);
    var z = zoneAt(p.x, p.y);
    start = z ? z.id : null;
  }

  // Runs inside the tap (an activation-triggering event), so the native
  // picker / keyboard is allowed to open.
  function onEnd(e) {
    var began = start;
    start = null;
    if (!began || !zones.length || otherDialogOpen()) return;
    var p = point(e);
    var z = zoneAt(p.x, p.y);
    if (!z || z.id !== began) return;
    var now = Date.now();
    if (now - lastFire < 800) return;  // touchend + compatibility mouseup
    lastFire = now;
    if (z.id === 'message') openMessage();
    else if (z.id === 'share') doShare();
    else if (z.id === 'copy') doCopy();
    else openPicker();
  }

  window.addEventListener('touchstart', onStart, { capture: true, passive: true });
  window.addEventListener('touchend', onEnd, { capture: true, passive: true });
  window.addEventListener('mousedown', onStart, { capture: true, passive: true });
  window.addEventListener('mouseup', onEnd, { capture: true, passive: true });

  // --- Photo ---------------------------------------------------------------
  function openPicker() {
    if (photoBusy) return;
    if (!input) {
      input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.id = 'ce-photo-input';
      input.style.cssText = 'position:fixed;left:-1000px;top:0;width:1px;height:1px;opacity:0';
      input.addEventListener('change', function () {
        var f = input.files && input.files[0];
        input.value = '';  // choosing the same photo again still fires change
        if (f) decode(f);
      });
      document.body.appendChild(input);
    }
    input.click();
  }

  function fail(code) {
    photoBusy = false;
    photoResult = JSON.stringify({ ok: false, error: code });
  }

  function decode(file) {
    if (file.type && file.type.indexOf('image/') !== 0) { fail('type'); return; }
    if (file.size > MAX_FILE_BYTES) { fail('too_large'); return; }
    photoBusy = true;
    photoResult = '';
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h) { URL.revokeObjectURL(url); fail('decode'); return; }
      var s = Math.min(1, MAX_EDGE / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
      var cv = document.createElement('canvas');
      cv.width = cw; cv.height = ch;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff';  // transparent PNGs get a white background
      ctx.fillRect(0, 0, cw, ch);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, cw, ch);
      URL.revokeObjectURL(url);
      img.onload = img.onerror = null;  // clearing src must not report an error
      img.src = '';
      cv.toBlob(function (blob) {
        cv.width = 0; cv.height = 0;  // free the canvas memory at once (iOS)
        if (!blob) { fail('encode'); return; }
        var fr = new FileReader();
        fr.onload = function () {
          var s64 = String(fr.result);
          photoBusy = false;
          photoResult = JSON.stringify({ ok: true, w: cw, h: ch, source_w: w, source_h: h,
            b64: s64.slice(s64.indexOf(',') + 1) });
        };
        fr.onerror = function () { fail('encode'); };
        fr.readAsDataURL(blob);
      }, 'image/jpeg', JPEG_QUALITY);
    };
    img.onerror = function () { URL.revokeObjectURL(url); fail('decode'); };
    img.src = url;
  }

  // --- Message ---------------------------------------------------------------
  function openMessage() {
    var old = document.getElementById('ce-message');
    if (old) old.remove();
    dialogOpen = true;
    var opened = Date.now();
    var d = document.createElement('div');
    d.id = 'ce-message';
    // Top-aligned and sized to the visible area, so the keyboard never
    // covers the text field.
    d.style.cssText = 'position:fixed;left:0;right:0;top:0;height:100%;z-index:10003;display:flex;align-items:flex-start;justify-content:center;' +
      'background:rgba(18,16,30,.88);' + ui + 'padding:max(14px,env(safe-area-inset-top)) 14px 14px;box-sizing:border-box;overflow:auto';
    var c = document.createElement('div');
    c.style.cssText = 'background:#fff;color:#2B2440;border-radius:22px;padding:18px;max-width:440px;width:100%;box-sizing:border-box;border:3px solid #EBCBF7';
    var title = document.createElement('div');
    title.style.cssText = 'font-size:20px;font-weight:900;margin-bottom:6px';
    title.textContent = 'ADD A MESSAGE';
    var help = document.createElement('div');
    help.style.cssText = 'font-size:14px;line-height:1.4;margin-bottom:10px;color:#5C5475';
    help.textContent = \"Add something they'll see when they escape.\";
    var ta = document.createElement('textarea');
    ta.id = 'ce-message-text';
    ta.maxLength = MESSAGE_MAX;
    ta.rows = 4;
    ta.placeholder = 'Write your message';
    ta.value = draft.slice(0, MESSAGE_MAX);
    // 16px+ so iPhone Safari does not zoom the page when the field is focused.
    ta.style.cssText = 'width:100%;box-sizing:border-box;height:118px;border:2px solid #E4DEF2;border-radius:12px;padding:10px;font:16px/1.35 -apple-system,system-ui,sans-serif;resize:none';
    var count = document.createElement('div');
    count.id = 'ce-message-count';
    count.style.cssText = 'text-align:right;font-size:13px;font-weight:700;color:#7A7596;margin-top:4px';
    function recount() { count.textContent = ta.value.length + ' / ' + MESSAGE_MAX; }
    ta.addEventListener('input', recount);
    recount();
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:10px;margin-top:8px';
    function btn(id, text, bg, fg) {
      var b = document.createElement('button');
      b.id = id;
      b.textContent = text;
      b.style.cssText = 'flex:1;border:0;border-radius:16px;padding:15px 10px;background:' + bg + ';color:' + fg + ';' + ui + 'font-weight:800;font-size:17px';
      return b;
    }
    var cancel = btn('ce-message-cancel', 'CANCEL', '#F1EDF9', '#2B2440');
    var done = btn('ce-message-done', 'DONE', '#C645E6', '#fff');
    function close(result) {
      if (Date.now() - opened < 400) return;  // the opening tap's own click
      messageResult = JSON.stringify(result);
      dialogOpen = false;
      if (vv) vv.removeEventListener('resize', fit);
      ta.blur();
      d.remove();
    }
    cancel.addEventListener('click', function () { close({ done: false }); });
    done.addEventListener('click', function () { close({ done: true, text: ta.value.slice(0, MESSAGE_MAX) }); });
    row.appendChild(cancel); row.appendChild(done);
    c.appendChild(title); c.appendChild(help); c.appendChild(ta); c.appendChild(count); c.appendChild(row);
    d.appendChild(c);
    document.body.appendChild(d);
    var vv = window.visualViewport;
    function fit() { d.style.height = vv.height + 'px'; d.style.top = vv.offsetTop + 'px'; }
    if (vv) { vv.addEventListener('resize', fit); fit(); }
    // Inside the tap: iPhone Safari brings the keyboard up.
    try { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) { /* tap the field */ }
  }

  // --- Share (0.2C) -----------------------------------------------------------
  function doShare() {
    if (!share.url) return;
    if (navigator.share) {
      try {
        navigator.share({ title: share.title, text: share.text, url: share.url }).then(
          function () { shareResult = 'shared'; },
          function (e) { shareResult = (e && e.name === 'AbortError') ? 'cancelled' : 'failed'; });
        return;
      } catch (e) { /* fall through to copy */ }
    }
    doCopy();
  }

  function copyFallback() {
    var ta = document.createElement('textarea');
    ta.value = share.url;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-1000px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    shareResult = ok ? 'copied' : 'failed';
  }

  function doCopy() {
    if (!share.url) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        navigator.clipboard.writeText(share.url).then(function () { shareResult = 'copied'; }, copyFallback);
        return;
      } catch (e) { /* older browsers */ }
    }
    copyFallback();
  }

  // --- API used by Godot ----------------------------------------------------
  window.ceSocial = {
    /** zones: JSON [{id, x, y, w, h}] normalized to the canvas; '[]' clears. */
    setZones: function (json) { try { zones = JSON.parse(json) || []; } catch (e) { zones = []; } },
    /** '' while nothing is ready; else JSON {ok, w, h, source_w, source_h, b64} or {ok:false, error}. */
    takePhoto: function () { var r = photoResult; photoResult = ''; return r; },
    photoBusy: function () { return photoBusy; },
    setDraft: function (text) { draft = String(text || ''); },
    /** '' while the dialog is open / unused; else JSON {done, text}. */
    takeMessage: function () { var r = messageResult; messageResult = ''; return r; },
    dialogOpen: function () { return dialogOpen; },
    /** The link SHARE / COPY LINK will hand over (set before showing them). */
    setShare: function (url, text, title) { share = { url: String(url || ''), text: String(text || ''), title: String(title || '') }; },
    /** '' until a share / copy finished: 'shared' | 'copied' | 'cancelled' | 'failed'. */
    takeShareResult: function () { var r = shareResult; shareResult = ''; return r; },
    canShare: function () { return !!navigator.share; },
    /** This page's address without query / fragment (base for share links). */
    pageBase: function () { return location.origin + location.pathname; },
    /** Challenge parameter this page was opened with: '' = none, else
     *  '=' + the raw value (possibly malformed - the game validates it). */
    launchChallenge: function () { return launchRaw === null ? '' : '=' + launchRaw; },
    /** True when the address asks for the developer generation benchmark. */
    devBench: function () { return devBench; },
    /** Leaving the flow: forget zones, pending results and any open dialog. */
    reset: function () {
      zones = []; photoResult = ''; messageResult = ''; draft = '';
      share = { url: '', text: '', title: '' }; shareResult = '';
      var m = document.getElementById('ce-message');
      if (m) m.remove();
      dialogOpen = false;
    }
  };
})();
</script>
<script>
/*
 * Chain Escape - developer share test page (?sharetest=1 or &sharetest=1).
 *
 * Real-device check only: which way of handing a message to WhatsApp opens
 * the MAIN WhatsApp app (so a sent message leaves at once) while keeping the
 * game page alive. Three plain links, so each gets a genuine iPhone tap:
 *   1  https://wa.me/?text=...   same page
 *   2  https://wa.me/?text=...   new tab (target=_blank)
 *   3  whatsapp://send?text=...
 * The message is a dummy test text with a timestamp (no challenge, no
 * private data). \"Loads in this tab\" counts page loads in this tab
 * (sessionStorage): if it went up after coming back, the page reloaded.
 * Does nothing at all without the parameter; never touches the game, the
 * save, the network or the production SHARE.
 */
(function () {
  'use strict';
  var on = false;
  try {
    var parts = String(location.search + location.hash).split(/[?&#]/);
    for (var i = 0; i < parts.length; i++) {
      if (/^sharetest=(1|true)$/i.test(parts[i])) on = true;
    }
  } catch (e) { on = false; }
  if (!on) return;

  var loads = 1;
  try {
    loads = (parseInt(sessionStorage.getItem('ce_sharetest_loads') || '0', 10) || 0) + 1;
    sessionStorage.setItem('ce_sharetest_loads', String(loads));
  } catch (e) { /* private mode: counter unavailable */ }
  var loadedAt = new Date().toTimeString().slice(0, 8);

  function build() {
    if (document.getElementById('ce-sharetest')) return;
    var stamp = new Date().toTimeString().slice(0, 8);
    var text = 'Chain Escape share test ' + stamp + ' ' + location.origin + location.pathname;
    var enc = encodeURIComponent(text);
    var ui = 'font-family:-apple-system,system-ui,sans-serif;';
    var d = document.createElement('div');
    d.id = 'ce-sharetest';
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483646;background:#fff;color:#2B2440;' +
      'padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;' +
      'box-shadow:0 -6px 24px rgba(0,0,0,.25);' + ui + 'font-size:15px;line-height:1.35';
    var html = '<div style=\"font-weight:800;font-size:17px;margin-bottom:4px\">SHARE TEST (DEV)</div>' +
      '<div id=\"ce-sharetest-info\" style=\"font-size:13px;color:#6B6480;margin-bottom:10px\">' +
      'Page loaded ' + loadedAt + ' · loads in this tab: <b id=\"ce-sharetest-loads\">' + loads + '</b><br>' +
      'Message: “' + text.replace(/</g, '&lt;') + '”</div>';
    var links = [
      ['ce-st-1', '1 · wa.me — same page', 'https://wa.me/?text=' + enc, ''],
      ['ce-st-2', '2 · wa.me — new tab', 'https://wa.me/?text=' + enc, '_blank'],
      ['ce-st-3', '3 · whatsapp://', 'whatsapp://send?text=' + enc, ''],
    ];
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      html += '<a id=\"' + l[0] + '\" href=\"' + l[2] + '\"' + (l[3] ? ' target=\"_blank\" rel=\"noopener\"' : '') +
        ' style=\"display:block;text-align:center;text-decoration:none;border-radius:14px;padding:14px 10px;margin-top:8px;' +
        'background:#C645E6;color:#fff;font-weight:800;font-size:17px\">' + l[1] + '</a>';
    }
    html += '<button id=\"ce-st-close\" style=\"display:block;width:100%;border:0;border-radius:14px;padding:12px;margin-top:8px;' +
      'background:#F1EDF9;color:#2B2440;' + ui + 'font-weight:800;font-size:16px\">HIDE</button>';
    d.innerHTML = html;
    // Taps here belong to this panel only (not the game underneath).
    ['touchstart', 'touchend', 'mousedown', 'mouseup', 'click'].forEach(function (t) {
      d.addEventListener(t, function (e) { e.stopPropagation(); }, false);
    });
    document.body.appendChild(d);
    document.getElementById('ce-st-close').addEventListener('click', function () { d.remove(); });
  }
  if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);
  window.ceShareTest = { loads: function () { return loads; } };
})();
</script>"
